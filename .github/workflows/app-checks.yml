name: Check the new app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup toolchain install nightly-2026-08-30 --profile minimal --component rust-src --target wasm32-unknown-unknown
      # Shares the compiled solver cache with the Pages workflow, which builds the same crate.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/wasm/target
          key: pages-rust-v1-${{ runner.os }}-${{ hashFiles('web/wasm/Cargo.lock', 'web/scripts/build-wasm.mjs') }}
      - name: Install wasm-pack
        run: npm install --global wasm-pack@0.15.0
      - run: npm ci
      - name: Build all four solver variants
        run: npm run wasm:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
