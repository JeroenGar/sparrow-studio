name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup toolchain install nightly-2026-08-30 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            web/wasm/target
          key: pages-rust-v1-${{ runner.os }}-${{ hashFiles('web/wasm/Cargo.lock', 'web/scripts/build-wasm.mjs') }}
      - name: Install wasm-pack
        run: |
          if ! wasm-pack --version 2>/dev/null | grep -q 'wasm-pack 0.15.0'; then
            cargo +stable install wasm-pack --version 0.15.0 --locked --force
          fi
      - run: npm ci
      - run: npm test
      - name: Build both solver variants and site
        run: npm run build
      - name: Check the production app
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
