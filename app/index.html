<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sparrow studio</title>
    <meta
      name="description"
      content="Nest irregular parts with the open-source sparrow algorithm, in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Pick the theme before the first paint, so the page never flashes the wrong one.
      let theme = 'system';
      try {
        theme = JSON.parse(localStorage.getItem('sparrow-studio-preferences') ?? '{}').theme;
      } catch {}
      const dark =
        theme === 'dark' ||
        (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"><p class="boot">Opening sparrow studio…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
