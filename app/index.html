<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sparrow studio</title>
    <meta
      name="description"
      content="Nest irregular parts with the open-source sparrow algorithm, in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="./sparrow-icon.svg" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('sparrow-studio-preferences') ?? '{}');
        document.documentElement.dataset.theme = ['light', 'dark'].includes(saved.theme)
          ? saved.theme
          : 'system';
      } catch {
        document.documentElement.dataset.theme = 'system';
      }
    </script>
  </head>
  <body>
    <div id="root"><p class="boot">Opening sparrow studio…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
